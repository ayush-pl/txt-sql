name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install "ruff>=0.6"
      - run: ruff check .

  test:
    # Python 3.12 (training/serving env) and 3.13 (app env). No GPU, no model: the pipeline
    # tests use a scripted fake LLM, and the gate re-scores committed predictions.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-service.txt
      - run: pip install -r requirements-service.txt pytest
      - run: pytest -q

  eval-gate:
    # Fails the build if the committed predictions for the 150-question gate set fall below
    # eval/gate/thresholds.yaml, are incomplete, or were made with a different prompt format.
    # Refresh them with `python -m eval.gate predict` whenever the model or prompt changes.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: requirements-service.txt }
      - run: pip install -r requirements-service.txt
      - name: Eval gate
        run: python -m eval.gate check | tee gate.txt
      - name: Gate summary
        if: always()
        run: |
          echo '### Eval gate' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat gate.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API/UI image
        run: docker build -t sqlforge-app:ci .
      - name: Smoke-test the image
        run: docker run --rm sqlforge-app:ci python -c "import app.api, app.guardrails; print('imports ok')"
