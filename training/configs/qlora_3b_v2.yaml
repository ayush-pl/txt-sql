# Run 2: Spider + BIRD train (with evidence hints), checkpoint chosen by execution accuracy.
# Changes vs run 1 (qlora_3b.yaml):
#   - data: + BIRD train (gold SQL verified by execution), so the model sees hints, quoted
#     column names and value-level filters
#   - select_metric: ex  (run 1: val loss picked step 100, but step 956 had +2.5 Spider EX)
#   - 1 epoch: the dataset is ~2x larger with longer prompts; ~1,000 steps
run_name: qlora-3b-r16-v2
base_model: Qwen/Qwen2.5-Coder-3B-Instruct
data_dir: data/processed/sft_spider_bird
output_dir: outputs/checkpoints/qlora-3b-r16-v2

# quantization (QLoRA)
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# optimization
num_train_epochs: 1
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
per_device_train_batch_size: 2
gradient_accumulation_steps: 8      # effective batch 16; batch 2 keeps long BIRD batches under 8 GB (batch 4 hit 7.9 GB and slowed to ~90 s/step)
max_length: 2048
optim: paged_adamw_8bit
weight_decay: 0.0
max_grad_norm: 1.0
gradient_checkpointing: true

# checkpoint selection by execution accuracy on held-out DBs
select_metric: ex
ex_eval_samples: 120

# logging / checkpoints
logging_steps: 10
eval_steps: 100
save_steps: 100                     # frequent saves: pausing costs at most 100 steps
save_total_limit: 3
max_steps: -1                       # override for smoke tests
seed: 42
