# QLoRA SFT for Qwen2.5-Coder-3B on Spider train, sized for an 8 GB GPU.
run_name: qlora-3b-r16
base_model: Qwen/Qwen2.5-Coder-3B-Instruct
data_dir: data/processed/sft
output_dir: outputs/checkpoints/qlora-3b-r16

# quantization (QLoRA)
load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_use_double_quant: true

# LoRA
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# optimization
num_train_epochs: 2
learning_rate: 2.0e-4
lr_scheduler_type: cosine
warmup_ratio: 0.03
per_device_train_batch_size: 4
gradient_accumulation_steps: 4      # effective batch 16
max_length: 2048
optim: paged_adamw_8bit
weight_decay: 0.0
max_grad_norm: 1.0
gradient_checkpointing: true

# logging / checkpoints
logging_steps: 10
eval_steps: 100
save_steps: 100
save_total_limit: 3
max_steps: -1                       # override for smoke tests
seed: 42
