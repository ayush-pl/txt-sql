# SQLForge observability stack: Langfuse v3 (traces, feedback) + Prometheus + Grafana.
#   python scripts/init_observability.py        # one-time: generate secrets -> observability/.env, keys -> .env
#   docker compose -f observability/docker-compose.yml --env-file observability/.env up -d
# UIs: Langfuse http://localhost:3000 · Grafana http://localhost:3001 · Prometheus http://localhost:9090
# The API (Windows, :8080) and vLLM (WSL, :8000) are scraped through host.docker.internal.

name: sqlforge

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  NEXTAUTH_URL: http://localhost:3000
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9002
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

services:
  langfuse-web:
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, clickhouse: { condition: service_healthy },
                  redis: { condition: service_healthy }, minio: { condition: service_healthy } }
    ports: ["127.0.0.1:3000:3000"]
    environment:
      <<: *langfuse-env
      # headless first-boot setup: org, project, API keys and an admin login
      LANGFUSE_INIT_ORG_ID: sqlforge
      LANGFUSE_INIT_ORG_NAME: SQLForge
      LANGFUSE_INIT_PROJECT_ID: sqlforge
      LANGFUSE_INIT_PROJECT_NAME: sqlforge
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_NAME: admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: { postgres: { condition: service_healthy }, clickhouse: { condition: service_healthy },
                  redis: { condition: service_healthy }, minio: { condition: service_healthy } }
    environment: *langfuse-env

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: postgres }
    volumes: [langfuse_postgres:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 3s, timeout: 3s, retries: 20 }

  clickhouse:
    image: clickhouse/clickhouse-server:24.12
    restart: unless-stopped
    user: "101:101"
    environment: { CLICKHOUSE_DB: default, CLICKHOUSE_USER: clickhouse, CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}" }
    volumes: [langfuse_clickhouse:/var/lib/clickhouse, langfuse_clickhouse_logs:/var/log/clickhouse-server]
    healthcheck: { test: "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1",
                   interval: 5s, timeout: 5s, retries: 20, start_period: 2s }

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["--requirepass", "${REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    healthcheck: { test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"], interval: 3s, timeout: 10s, retries: 10 }

  minio:
    image: cgr.dev/chainguard/minio
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment: { MINIO_ROOT_USER: minio, MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD}" }
    ports: ["127.0.0.1:9002:9000"]
    volumes: [langfuse_minio:/data]
    healthcheck: { test: ["CMD", "mc", "ready", "local"], interval: 2s, timeout: 10s, retries: 15, start_period: 2s }

  prometheus:
    image: prom/prometheus:v3.4.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: [./prometheus.yml:/etc/prometheus/prometheus.yml:ro, prometheus_data:/prometheus]
    extra_hosts: ["host.docker.internal:host-gateway"]

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on: [prometheus]
    ports: ["127.0.0.1:3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/sqlforge.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  langfuse_postgres:
  langfuse_clickhouse:
  langfuse_clickhouse_logs:
  langfuse_minio:
  prometheus_data:
  grafana_data:
